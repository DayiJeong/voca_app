<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f6bed">
  <title>단어짱 - 중고등 영어 단어 암기</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <button class="brand" data-go="home">📘 단어짱</button>
    <div class="row" style="gap:4px">
      <button class="acct-btn hidden" id="acct-btn" data-go="account"></button>
      <button class="icon-btn" data-go="settings" aria-label="설정">⚙️</button>
    </div>
  </header>

  <main id="view"></main>

  <nav class="tabbar">
    <button data-go="home"><b>🏠</b><span>홈</span></button>
    <button data-go="books"><b>📚</b><span>단어장</span></button>
    <button data-go="study"><b>✏️</b><span>학습</span></button>
    <button data-go="games"><b>🎮</b><span>게임</span></button>
    <button data-go="wrong"><b>❗</b><span>오답노트</span></button>
  </nav>

  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/sample.js"></script>
  <script src="js/store.js"></script>
  <script src="js/importer.js"></script>
  <script src="js/games.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/app.js"></script>
  <script src="js/account.js"></script>
</body>
</html>
